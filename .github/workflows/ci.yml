name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    environment: CI

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: handoff
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d handoff"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    strategy:
      matrix:
        node-version: [22]

    env:
      DATABASE_URL: "${{ secrets.CI_DATABASE_URL || secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/handoff' }}"
      NODE_ENV: test
      AUTH_SECRET: "${{ secrets.CI_AUTH_SECRET || secrets.AUTH_SECRET || 'ci-auth-secret' }}"
      BETTER_AUTH_SECRET: "${{ secrets.CI_BETTER_AUTH_SECRET || secrets.BETTER_AUTH_SECRET || 'ci-better-auth-secret-012345678901234567890123' }}"
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Validate environment variables
        run: |
          test -n "$DATABASE_URL" || {
            echo "DATABASE_URL is missing"
            exit 1
          }

          test -n "$AUTH_SECRET" || {
            echo "AUTH_SECRET is missing"
            exit 1
          }

          test "${#BETTER_AUTH_SECRET}" -ge 32 || {
            echo "BETTER_AUTH_SECRET must contain at least 32 characters"
            exit 1
          }

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: check
    environment: CI

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: handoff
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d handoff"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: "${{ secrets.CI_DATABASE_URL || secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/handoff' }}"
      NODE_ENV: production
      AUTH_SECRET: "${{ secrets.CI_AUTH_SECRET || secrets.AUTH_SECRET || 'ci-auth-secret' }}"
      BETTER_AUTH_SECRET: "${{ secrets.CI_BETTER_AUTH_SECRET || secrets.BETTER_AUTH_SECRET || 'ci-better-auth-secret-012345678901234567890123' }}"
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Validate environment variables
        run: |
          test -n "$DATABASE_URL" || {
            echo "DATABASE_URL is missing"
            exit 1
          }

          test -n "$AUTH_SECRET" || {
            echo "AUTH_SECRET is missing"
            exit 1
          }

          test "${#BETTER_AUTH_SECRET}" -ge 32 || {
            echo "BETTER_AUTH_SECRET must contain at least 32 characters"
            exit 1
          }

      - name: Build
        run: pnpm build