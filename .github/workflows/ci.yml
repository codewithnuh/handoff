name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    environment: CI

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: handoff_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d handoff_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    strategy:
      matrix:
        node-version: [22]

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/handoff_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/handoff_test
      NODE_ENV: test
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Configure synthetic CI environment
        shell: bash
        run: |
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "SMTP_HOST=smtp.invalid" >> "$GITHUB_ENV"
          echo "SMTP_PORT=587" >> "$GITHUB_ENV"
          echo "EMAIL_FROM=Handoff <ci@example.invalid>" >> "$GITHUB_ENV"
          token=$(printf '{"apiKey":"sk_ci_%s","appId":"handoff-ci","regions":["us-east-1"]}' "$(openssl rand -hex 32)" | base64 -w0)
          echo "UPLOADTHING_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Fresh install and populated upgrade migration tests
        run: pnpm test:migrations

      - name: Validate environment variables
        run: |
          test "$DATABASE_URL" = "postgresql://postgres:postgres@localhost:5432/handoff_test" || {
            echo "DATABASE_URL must use the disposable CI database"
            exit 1
          }

          test "${#AUTH_SECRET}" -ge 32 || {
            echo "AUTH_SECRET must contain at least 32 characters"
            exit 1
          }

          test "${#BETTER_AUTH_SECRET}" -ge 32 || {
            echo "BETTER_AUTH_SECRET must contain at least 32 characters"
            exit 1
          }

          test -n "$UPLOADTHING_TOKEN" || {
            echo "UPLOADTHING_TOKEN is missing"
            exit 1
          }

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      - name: PostgreSQL integration tests
        run: |
          pnpm test:integration
          pnpm test:integration

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: check
    environment: CI

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: handoff
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d handoff"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/handoff
      NODE_ENV: production
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Configure synthetic CI environment
        shell: bash
        run: |
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "SMTP_HOST=smtp.invalid" >> "$GITHUB_ENV"
          echo "SMTP_PORT=587" >> "$GITHUB_ENV"
          echo "EMAIL_FROM=Handoff <ci@example.invalid>" >> "$GITHUB_ENV"
          token=$(printf '{"apiKey":"sk_ci_%s","appId":"handoff-ci","regions":["us-east-1"]}' "$(openssl rand -hex 32)" | base64 -w0)
          echo "UPLOADTHING_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Validate environment variables
        run: |
          test "$DATABASE_URL" = "postgresql://postgres:postgres@localhost:5432/handoff" || {
            echo "DATABASE_URL must use the disposable CI database"
            exit 1
          }

          test "${#AUTH_SECRET}" -ge 32 || {
            echo "AUTH_SECRET must contain at least 32 characters"
            exit 1
          }

          test "${#BETTER_AUTH_SECRET}" -ge 32 || {
            echo "BETTER_AUTH_SECRET must contain at least 32 characters"
            exit 1
          }

          test -n "$UPLOADTHING_TOKEN" || {
            echo "UPLOADTHING_TOKEN is missing"
            exit 1
          }

          test -n "$SMTP_HOST" && test -n "$SMTP_PORT" && test -n "$EMAIL_FROM" || {
            echo "Synthetic SMTP settings are missing"
            exit 1
          }

      - name: Build
        run: pnpm build
