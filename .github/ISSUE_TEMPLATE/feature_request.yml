name: ✨ Feature request
description: Suggest a new feature or an improvement.
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please describe it clearly.

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: Describe the problem you're trying to solve. "I'm frustrated when ..."
      placeholder: "I'm always frustrated when I can't ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: What should the feature do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or workarounds you've tried.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, links, or anything else.
